services:
  weazltunes:
    build: .
    image: weazltunes-web:local
    ports:
      - "0.0.0.0:4000:4000"
    environment:
      LISTEN_ADDR: 0.0.0.0:4000
      DATA_DIR: /data
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CAPTURE_BUDGET_BYTES: ${CAPTURE_BUDGET_BYTES:-21474836480}
      CAPTURE_ACCOUNT_BUDGET_BYTES: ${CAPTURE_ACCOUNT_BUDGET_BYTES:-10737418240}
      CAPTURE_RESERVE_BYTES: ${CAPTURE_RESERVE_BYTES:-1073741824}
      CAPTURE_RETENTION_DAYS: ${CAPTURE_RETENTION_DAYS:-0}
    volumes:
      - weazltunes-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,mode=1777
volumes:
  weazltunes-data:
